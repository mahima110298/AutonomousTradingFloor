[project]
name = "trading-floor"
version = "0.1.0"
description = "Autonomous multi-agent trading floor: 4 collaborating agents, 6 MCP servers, 44 tools, simulated execution with full audit trails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahima Sachan" }]
keywords = ["mcp", "crewai", "langgraph", "agents", "trading", "simulation"]

dependencies = [
    "mcp>=1.2.0",
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.0.7",
    "crewai>=0.80.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "gradio>=4.44.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
trading-floor = "trading_floor.cli:app"
tf-market-data-server = "trading_floor.servers.market_data_server:main"
tf-news-server = "trading_floor.servers.news_server:main"
tf-portfolio-server = "trading_floor.servers.portfolio_server:main"
tf-execution-server = "trading_floor.servers.execution_server:main"
tf-risk-server = "trading_floor.servers.risk_server:main"
tf-audit-server = "trading_floor.servers.audit_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_floor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
